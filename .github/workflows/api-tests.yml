name: Java Tests

on:
  push:
    branches:
      - develop
      - wordle-review

  pull_request:
    branches:
      - develop

jobs:
  build-task-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile main sources
        run: |
          mkdir -p out
          find src/main/java -type f -name "*.java" > sources.txt
          javac -encoding UTF-8 -d out @sources.txt

      - name: Compile tests
        run: |
          find src/test/java -type f -name "*.java" > tests.txt
          javac \
            -encoding UTF-8 \
            -d out \
            -cp "out:lib/junit-platform-console-standalone-1.9.3.jar:lib/gson-2.10.1.jar" \
            @tests.txt

      - name: Run tests
        run: |
          java -jar lib/junit-platform-console-standalone-1.9.3.jar \
            --class-path out \
            --scan-class-path